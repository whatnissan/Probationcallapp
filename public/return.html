<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
__REFRESH__
<title>__TITLE__</title>
<style>
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a1929;color:#fff;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .card{max-width:420px;width:100%;text-align:center}
  .brand{color:#8892b0;font-size:0.85rem;letter-spacing:0.04em;margin:0 0 18px}
  h1{font-size:1.35rem;font-weight:600;margin:0 0 10px}
  p{color:#8892b0;font-size:0.95rem;line-height:1.6;margin:0 0 24px}
  .btn{display:block;background:#00d9ff;color:#000;text-decoration:none;font-weight:700;
       font-size:1.05rem;padding:16px 20px;border-radius:10px;margin-bottom:18px}
  .btn:active{opacity:0.85}
  .hint{color:#c7d3e8;font-size:0.92rem;margin:0 0 22px}
  .hint b{color:#fff}
  .fine{color:#5c6b8a;font-size:0.8rem;line-height:1.55;margin:0}
  .fine a{color:#8892b0}
</style>
</head>
<body>
  <div class="card">
    <p class="brand">ProbationCall</p>
    <!-- What happened. The server fills these from fixed sentences
         (lib/return-page.js) and claims a payment or a grant only when it
         has verified it with Stripe and our ledger. -->
    <h1>__HEADING__</h1>
    <p>__MESSAGE__</p>

    <!-- THE BUTTON IS THE WAY BACK. There is deliberately no automatic
         redirect to probationcall:// any more (2026-10-15): payment flows now
         open in real Safari, where a redirect to the app's scheme on a phone
         WITHOUT the app shows "Safari cannot open the page because the
         address is invalid" over this page, and on a phone WITH it the
         system prompt would cover the sentence above before it is read. A
         tap is a user gesture and opens the app reliably. The href is
         written by the server from a fixed allowlist, so this works with no
         JavaScript at all. -->
    <a class="btn" id="open" href="probationcall://return?to=__DEST__">Back to ProbationCall</a>

    <!-- iOS shows a system confirmation (Open in "Probationcall"? / Cancel /
         Open) before handing control back from a web page. Verified on
         device. Someone who meets an unexplained dialog can read it as a
         failure and tap Cancel, so this line sits directly under the button,
         where the eye goes after tapping. -->
    <p class="hint">Tap <b>Open</b> when your phone asks.</p>

    <!-- For someone without the app on this device: the page must still
         make sense, and lead somewhere. /login sends a signed-in browser
         straight on to the dashboard. -->
    <p class="fine">No app on this device? <a href="/login">Sign in on the website</a> to see your account. You can close this page.</p>
  </div>
</body>
</html>
